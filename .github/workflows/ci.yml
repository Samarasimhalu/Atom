name: Atom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify committed dependency lockfiles
        shell: bash
        run: |
          test -s package-lock.json || { echo "Missing root package-lock.json"; exit 1; }
          test -s src/frontend/pnpm-lock.yaml || { echo "Missing frontend pnpm-lock.yaml"; exit 1; }
      - name: Install backend dependencies
        run: npm ci
        working-directory: .
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - run: npm run lint:backend
      - run: npm test
      - name: Build frontend
        run: pnpm run build
        working-directory: src/frontend
      - run: npm audit --audit-level=high --package-lock-only
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release manifest when supplied
        if: ${{ hashFiles('release-manifest.json') != '' }}
        run: npm run verify:release
      - name: Enforce P0 release-remediation invariants
        run: npm run security:p0:guard
      - name: Enforce P1 release-control invariants
        run: npm run security:p1:guard
      - name: Run AI evaluation harness
        run: npm run evaluate:ai
        env:
          AUTH_MODE: strict
          EVAL_MINIMUM_SCORE: '0.85'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: atom-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: atom-sbom
          path: atom-sbom.cdx.json

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Attest SBOM provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: atom-sbom.cdx.json

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/playwright/Dockerfile
          load: true
          tags: atom-playwright-worker:${{ github.sha }}
          provenance: false
          sbom: false
      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atom-playwright-worker:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
