name: Atom CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend
      - run: npm run lint:backend
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Run AI evaluation harness
        run: npm run evaluate:ai
        env:
          AUTH_MODE: strict
          EVAL_MINIMUM_SCORE: '0.85'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: atom-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: atom-sbom
          path: atom-sbom.cdx.json

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Attest SBOM provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: atom-sbom.cdx.json

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/playwright/Dockerfile
          push: false
          tags: atom-playwright-worker:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: atom-playwright-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
