name: Publish GitHub Package

on:
  release:
    types: [published]
  push:
    branches: [main, UI_Changes]
    paths:
      - 'package.json'
      - '.github/workflows/publish-github-package.yml'
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'bin/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-github-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      - name: Build frontend UI
        run: pnpm run build
        working-directory: src/frontend

      - name: Configure package and .npmrc for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@samarasimhalu/atom';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const npmrc = [
              '@samarasimhalu:registry=https://npm.pkg.github.com',
              '//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}',
              ''
            ].join('\n');
            fs.writeFileSync('.npmrc', npmrc, 'utf8');
          "

      - name: Publish to GitHub Packages
        run: npm publish --ignore-scripts || echo "Version already published to GitHub Packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package download from GitHub Packages
        run: |
          mkdir -p /tmp/gh-pkg-verify
          cd /tmp/gh-pkg-verify
          cp "$GITHUB_WORKSPACE/.npmrc" .npmrc
          npm pack @samarasimhalu/atom --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
